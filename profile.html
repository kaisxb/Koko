<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي | kai </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.7);
      --primary: #38bdf8;
      --accent: #818cf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.15) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 28px;
      width: 100%;
      max-width: 520px;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.1);
      position: relative;
      overflow: hidden;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 1.5rem;
    }

    .avatar-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.35);
      border: 3px solid rgba(255, 255, 255, 0.2);
    }

    .status-dot {
      width: 18px;
      height: 18px;
      background: #22c55e;
      border: 3px solid #0f172a;
      border-radius: 50%;
      position: absolute;
      bottom: 4px;
      left: 6px;
    }

    .profile-info {
      text-align: center;
      margin-bottom: 2rem;
    }

    .profile-name {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 0.3rem;
    }

    .profile-handle {
      color: var(--primary);
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
      direction: ltr;
      display: inline-block;
    }

    .profile-bio {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.8rem;
    }

    .tag {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 0.45rem 0.9rem;
      border-radius: 12px;
      font-size: 0.9rem;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .tag:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-2px);
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.2rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .link-item:hover {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.15), rgba(99, 102, 241, 0.15));
      border-color: rgba(56, 189, 248, 0.4);
      transform: scale(1.02);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .arrow {
      color: var(--text-muted);
      font-size: 1.1rem;
      transition: transform 0.2s ease;
    }

    .link-item:hover .arrow {
      transform: translateX(-4px);
      color: var(--primary);
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <div class="avatar-wrapper">
      <div class="avatar-circle">ع</div>
      <div class="status-dot"></div>
    </div>

    <div class="profile-info">
      <h1 class="profile-name">عصام</h1>
      <span class="profile-handle">@kaisxb</span>
      <p class="profile-bio">شغوف بعالم البرمجة، التصميم، وتطوير الويب وصناعة المشاريع والتحديات التفاعلية 🚀</p>
    </div>

    <div class="section-title">💡 الاهتمامات والمهارات</div>
    <div class="tags-container">
      <span class="tag">💻 تطوير الويب</span>
      <span class="tag">🎨 تصميم واجهات ومتاجر</span>
      <span class="tag">🎮 ألعاب وتحديات</span>
      <span class="tag">⚡ GitHub Pages</span>
    </div>

    <div class="section-title">🔗 روابط ومشاريع</div>
    <div class="links-list">
      <a href="https://github.com/kaisxb" target="_blank" class="link-item">
        <div class="link-left">
          <span>🐙</span>
          <span>حسابي على GitHub</span>
        </div>
        <span class="arrow">←</span>
      </a>

      <a href="https://kaisxb.github.io/kai/" target="_blank" class="link-item">
        <div class="link-left">
          <span>🔥</span>
          <span>تحدي لغتي الأسطوري</span>
        </div>
        <span class="arrow">←</span>
      </a>
    </div>

    <div class="footer">
      تم التصميم والتطوير بكل شغف ✨
    </div>
  </div>

</body>
</html>
